<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MonitorHub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      padding: 24px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: #93c5fd;
      letter-spacing: 0.04em;
    }

    #status {
      display: inline-block;
      margin-bottom: 20px;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 600;
      background: #1e293b;
      color: #94a3b8;
    }
    #status.connected    { background: #14532d; color: #86efac; }
    #status.disconnected { background: #450a0a; color: #fca5a5; }

    #offline-notice {
      display: none;
      margin-bottom: 20px;
      padding: 12px 16px;
      border: 1px solid #991b1b;
      border-radius: 8px;
      background: #2a1215;
      color: #fecaca;
    }
    #offline-notice.visible { display: block; }
    #offline-notice strong { display: block; margin-bottom: 4px; }
    #offline-list { color: #fca5a5; font-size: 0.85rem; }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px;
    }
    .card.offline {
      border-color: #991b1b;
      opacity: 0.72;
    }
    .device-status {
      display: block;
      width: 100%;
      margin-bottom: 12px;
      padding: 8px 10px;
      border-radius: 4px;
      background: #14532d;
      color: #86efac;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-align: center;
    }
    .device-status.offline {
      background: #450a0a;
      color: #fca5a5;
    }
    .offline-message {
      padding: 16px 0 4px;
      color: #fca5a5;
      font-size: 0.85rem;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }

    .device-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .hostname {
      font-size: 0.92rem;
      font-weight: 600;
      color: #e2e8f0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .device-id {
      font-size: 0.78rem;
      font-family: monospace;
      color: #7dd3fc;
      word-break: break-all;
    }

    .cpu-temp {
      font-size: 0.7rem;
      color: #64748b;
      white-space: nowrap;
      margin-left: 8px;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.82rem;
    }

    .metric-label { color: #94a3b8; }
    .metric-value { font-weight: 600; color: #e2e8f0; }

    .bar-wrap {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .bar-cpu  { background: #38bdf8; }
    .bar-mem  { background: #a78bfa; }
    .bar-disk { background: #f59e0b; }

    .cores {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .core-bar-wrap {
      flex: 1;
      min-width: 24px;
      height: 40px;
      background: #0f172a;
      border-radius: 3px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }
    .core-bar-fill {
      width: 100%;
      background: #38bdf8;
      transition: height 0.4s ease;
    }

    .divider {
      border: none;
      border-top: 1px solid #334155;
      margin: 10px 0;
    }

    .io-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 16px;
      font-size: 0.78rem;
    }
    .nd-label { color: #94a3b8; }
    .nd-value { color: #e2e8f0; font-weight: 600; text-align: right; }
  </style>
</head>
<body>
  <h1>MonitorHub</h1>
  <div id="status">Connecting…</div>
  <div id="offline-notice">
    <strong>Offline devices</strong>
    <div id="offline-list"></div>
  </div>
  <div id="grid"></div>

  <script>
    const grid = document.getElementById('grid');
    const statusEl = document.getElementById('status');
    const offlineNotice = document.getElementById('offline-notice');
    const offlineList = document.getElementById('offline-list');
    const cards = {};
    const devices = {};
    const statuses = {};

    function fmt(bytes) {
      if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(1) + ' GB';
      if (bytes >= 1048576)    return (bytes / 1048576).toFixed(1) + ' MB';
      if (bytes >= 1024)       return (bytes / 1024).toFixed(1) + ' KB';
      return bytes + ' B';
    }

    function fmtRate(bytes) { return fmt(bytes) + '/s'; }

    function clampPct(v) {
      if (!Number.isFinite(v)) return 0;
      return Math.max(0, Math.min(v, 100));
    }

    function shortId(id) {
      return id.length > 16 ? id.slice(0, 8) + '…' + id.slice(-8) : id;
    }

    function ageText(lastSeen) {
      if (!lastSeen) return 'never';
      const seconds = Math.max(0, Math.floor((Date.now() - Date.parse(lastSeen)) / 1000));
      if (seconds < 60) return `${seconds}s ago`;
      return `${Math.floor(seconds / 60)}m ${seconds % 60}s ago`;
    }

    function statusFor(m) {
      console.log('statusFor', m);
      console.log('statuses', statuses);
      return statuses[m.device_id] || null;
    }

    function renderCard(m) {
      const status = statusFor(m);
      const offline = status && !status.online;
      if (offline) {
        return `
          <div class="device-status offline">Offline</div>
          <div class="card-header">
            <div class="device-meta">
              <span class="hostname" title="${m.hostname || ''}">${m.hostname || 'Unknown host'}</span>
              <span class="device-id" title="${m.device_id}">${shortId(m.device_id)}</span>
            </div>
          </div>
          <div class="offline-message">No live data available. Last seen ${ageText(status.last_seen)}.</div>
        `;
      }
      const cpuPct  = clampPct(m.cpu_usage).toFixed(1);
      const memPct  = m.total_memory > 0
        ? clampPct((m.used_memory / m.total_memory) * 100).toFixed(1)
        : 0;
      const diskPct = clampPct(m.disk_usage_pct).toFixed(1);

      const coreHTML = (m.core_cpu_usage || []).map(v => {
        const h = clampPct(v).toFixed(0);
        return `<div class="core-bar-wrap" title="${v.toFixed(1)}%">
          <div class="core-bar-fill" style="height:${h}%"></div>
        </div>`;
      }).join('');

      const cpuTemp = Number.isFinite(m.cpu_temp)
        ? `${m.cpu_temp.toFixed(1)}C`
        : 'n/a';

      return `
        <div class="device-status${offline ? ' offline' : ''}">${offline ? `Offline — last seen ${ageText(status.last_seen)}` : 'Online'}</div>
        <div class="card-header">
          <div class="device-meta">
            <span class="hostname" title="${m.hostname || ''}">${m.hostname || 'Unknown host'}</span>
            <span class="device-id" title="${m.device_id}">${shortId(m.device_id)}</span>
          </div>
          <span class="cpu-temp">${cpuTemp}</span>
        </div>

        <div class="metric-row">
          <span class="metric-label">CPU</span>
          <span class="metric-value">${cpuPct}%</span>
        </div>
        <div class="bar-wrap"><div class="bar-fill bar-cpu" style="width:${cpuPct}%"></div></div>

        <div class="cores">${coreHTML}</div>

        <div class="metric-row">
          <span class="metric-label">Memory</span>
          <span class="metric-value">${fmt(m.used_memory)} / ${fmt(m.total_memory)} (${memPct}%)</span>
        </div>
        <div class="bar-wrap"><div class="bar-fill bar-mem" style="width:${memPct}%"></div></div>

        <hr class="divider" />

        <div class="io-grid">
          <span class="nd-label">Disk read</span>  <span class="nd-value">${fmtRate(m.disk_read)}</span>
          <span class="nd-label">Disk write</span> <span class="nd-value">${fmtRate(m.disk_write)}</span>
        </div>

        <div class="metric-row">
          <span class="metric-label">Disk usage</span>
          <span class="metric-value">${diskPct}%</span>
        </div>
        <div class="bar-wrap"><div class="bar-fill bar-disk" style="width:${diskPct}%"></div></div>

        <div class="io-grid">
          <span class="nd-label">Net RX</span>     <span class="nd-value">${fmtRate(m.net_rx)}</span>
          <span class="nd-label">Net TX</span>     <span class="nd-value">${fmtRate(m.net_tx)}</span>
        </div>
      `;
    }

    function upsertDevice(m) {
      devices[m.device_id] = m;
      let card = cards[m.device_id];
      if (!card) {
        card = document.createElement('div');
        card.className = 'card';
        grid.appendChild(card);
        cards[m.device_id] = card;
      }
      const status = statusFor(m);
      card.className = `card${status && status.state === 'offline' ? ' offline' : ''}`;
      card.innerHTML = renderCard(m);
    }

    function upsertStatusCard(status) {
      let card = cards[status.device_id];
      if (!card) {
        card = document.createElement('div');
        card.className = 'card';
        grid.appendChild(card);
        cards[status.device_id] = card;
      }
      const offline = !status.online;
      card.className = `card${offline ? ' offline' : ''}`;
      const name = status.hostname || status.target || 'Unknown host';
      card.innerHTML = `
        <div class="device-status${offline ? ' offline' : ''}">${offline ? 'Offline' : 'Online'}</div>
        <div class="card-header">
          <div class="device-meta">
            <span class="hostname" title="${name}">${name}</span>
            <span class="device-id" title="${status.device_id}">${shortId(status.device_id)}</span>
          </div>
        </div>
        <div class="offline-message">${offline
          ? `No live data available. Last seen ${ageText(status.last_seen)}.`
          : 'Waiting for live data.'}</div>
      `;
    }

    function renderOfflineNotice() {
      const offline = Object.values(statuses).filter(s => s.state === 'offline');
      offlineNotice.className = offline.length ? 'visible' : '';
      offlineList.textContent = offline.map(s => {
        const name = s.device_id === s.target ? s.target : (s.hostname || s.device_id);
        return `${name} — last seen ${ageText(s.last_seen)}`;
      }).join(' • ');
    }

    function applyStatus(status) {
      if (!status || !status.target) return;
      Object.keys(statuses).forEach(key => {
        if (key !== status.device_id && statuses[key].target === status.target) {
          delete statuses[key];
        }
      });
      statuses[status.device_id] = status;
      if (devices[status.device_id]) {
        upsertDevice(devices[status.device_id]);
      } else {
        upsertStatusCard(status);
      }
      renderOfflineNotice();
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}/ws`);

      ws.onopen = () => {
        statusEl.textContent = 'Connected';
        statusEl.className = 'connected';
      };

      ws.onclose = () => {
        statusEl.textContent = 'Disconnected — reconnecting…';
        statusEl.className = 'disconnected';
        setTimeout(connect, 3000);
      };

      ws.onerror = () => ws.close();

      ws.onmessage = (event) => {
        let msg;
        try { msg = JSON.parse(event.data); } catch { return; }

        if (msg.type === 'snapshot') {
          (msg.statuses || []).forEach(applyStatus);
          (msg.devices || []).forEach(upsertDevice);
          renderOfflineNotice();
        } else if (msg.type === 'update' && msg.device) {
          upsertDevice(msg.device);
        } else if (msg.type === 'status' && msg.status) {
          applyStatus(msg.status);
        }
      };
    }

    connect();
  </script>
</body>
</html>
